services:
  db:
    image: postgres:16-alpine
    container_name: epg-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-epg}
      POSTGRES_USER: ${POSTGRES_USER:-epg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-epg-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./apps/api/db/seed-units.sql:/docker-entrypoint-initdb.d/002-seed-units.sql:ro
      - ./apps/api/db/seed-spaces.sql:/docker-entrypoint-initdb.d/003-seed-spaces.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-epg} -d ${POSTGRES_DB:-epg}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    container_name: epg-api
    restart: unless-stopped
    environment:
      PORT: 8787
      DATABASE_URL: postgres://${POSTGRES_USER:-epg}:${POSTGRES_PASSWORD:-epg-local-password}@db:5432/${POSTGRES_DB:-epg}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      WEB_ORIGIN: http://localhost:5173,http://localhost:8080,http://localhost:8081,http://127.0.0.1:5173,http://127.0.0.1:8080,http://127.0.0.1:8081
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-epg-media}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8787:8787"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8787}
    container_name: epg-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  postgres_data:
